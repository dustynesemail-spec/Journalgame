<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>The Lost Helicopter Journal v0.2.1</title>
<style>
:root{
  --ink:#173247;--paper:#f7e8c3;--paper2:#fff7df;--wood:#76502c;
  --ocean:#1786a4;--green:#4d8b4b;--red:#9e3b2a;--gold:#d6a126;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#073246;font-family:Trebuchet MS,Arial,sans-serif;color:#162b34}
button{font:inherit;touch-action:manipulation}
#game{height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:auto;background:#cfe7ea;overflow:hidden}
header{
  flex:0 0 auto;background:linear-gradient(#d6a45a,#b87b36);border-bottom:4px solid #51341d;
  padding:5px 8px calc(5px + env(safe-area-inset-top));text-align:center;color:#2b2115;z-index:5
}
header h1{font-size:clamp(18px,4.5vw,30px);line-height:1;margin:0}
header .sub{font-size:11px;font-weight:bold;margin-top:2px}
.status{
  flex:0 0 auto;display:grid;grid-template-columns:1.3fr 1fr;gap:6px;padding:6px;background:#0b5368;color:white;z-index:4
}
.statusBox{background:#0a3f52;border:2px solid #d1b26b;border-radius:9px;padding:5px 7px;min-height:44px}
#turn{font-size:14px;font-weight:900}
#teamline,#mission{font-size:11px;line-height:1.3}
#mapWrap{position:relative;flex:1 1 auto;min-height:0;padding:6px;background:var(--ocean);overflow:hidden}
#map{
  height:100%;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;
  gap:6px
}
.region{
  border:3px solid rgba(65,45,25,.78);border-radius:18px;padding:7px;position:relative;
  box-shadow:inset 0 0 16px #ffffff66;overflow:hidden;user-select:none
}
.region h2{font-size:clamp(15px,4vw,22px);margin:0;line-height:1}
.region .res{font-size:10px;font-weight:bold;margin-top:3px}
.region .occupants{position:absolute;left:5px;right:5px;bottom:4px;display:flex;flex-wrap:wrap;gap:3px}
.region.selected{outline:4px solid #fff7a6;outline-offset:-5px}
.region.reachable::after{content:"MOVE";position:absolute;right:5px;top:5px;background:#ffffffdd;color:#1b513b;padding:2px 5px;border-radius:8px;font-size:9px;font-weight:900}
.Beach{background:#efd28c}.Forest{background:#70aa61}.Desert{background:#e9bf64}.Ice{background:#cdeef5}.Cave{background:#a3947e}.Centre{background:#dcc7a3}
.locked{filter:grayscale(.75);opacity:.64}
.pawn,.monster{
  display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:25px;padding:0 5px;
  border-radius:999px;background:#173247;color:#fff;font-weight:900;font-size:10px;border:2px solid #fff8
}
.monster{background:#8f3028}
#toast{
  position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:4;max-width:90%;
  background:#142f3ce8;color:white;border:2px solid #e3c97b;border-radius:12px;padding:7px 10px;
  font-size:12px;font-weight:bold;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s
}
#toast.show{opacity:1}
.actions{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:#082f3f;border-top:3px solid #d4b76d;z-index:6
}
.action{
  min-height:47px;border:0;border-radius:10px;background:#2c705f;color:white;font-weight:900;font-size:11px;
  box-shadow:0 3px 0 #153d35;padding:4px;cursor:pointer
}
.action.secondary{background:#7b552f;box-shadow:0 3px 0 #46301c}
.action:disabled{opacity:.35;box-shadow:none}
.action.active{outline:3px solid #ffe289;background:#39856f}
.overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.overlay.open{display:flex}
.modal{width:min(540px,96vw);max-height:85dvh;overflow:auto;background:var(--paper2);border:5px solid #684522;border-radius:16px;padding:14px;text-align:center}
.modal h2{margin:0 0 8px;color:#31573f}
.choice{display:block;width:100%;margin:7px 0;padding:11px;border:0;border-radius:10px;background:#2d6e5c;color:white;font-weight:900;cursor:pointer}
.choice.alt{background:#80562f}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:5px 0}
.chip{background:#ead39c;padding:3px 6px;border-radius:8px;font-size:11px;font-weight:bold}
.heart{color:#d63d33}
.journalList{text-align:left;background:#f4e4bd;padding:8px;border-radius:8px}
@media (max-width:650px){
  .status{grid-template-columns:1fr 1fr}
  #map{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr}
  .region{border-radius:14px;padding:5px}
  .region h2{font-size:16px}
  .actions{grid-template-columns:repeat(4,1fr)}
}
@media (max-height:650px){
  header .sub{display:none}
  .statusBox{min-height:36px;padding:3px 6px}
  .action{min-height:40px}
}
#turn{background:#fff0a6;color:#173247;border-radius:6px;padding:5px;font-size:16px}
.pawn.current{background:#ffe289;color:#173247;border:2px solid #173247}
#moveGuide{display:none;flex:0 0 auto;padding:8px;background:#fff0a6;color:#173247;font-size:13px;font-weight:bold;text-align:center}
#moveGuide.visible{display:block}
.turnRole{font-size:clamp(30px,8vw,46px);margin:8px 0;color:#173247}
.turnBadge{font-size:14px;font-weight:bold;letter-spacing:.12em;text-transform:uppercase}
.guideCopy{font-size:17px;line-height:1.5}
.modal:focus{outline:none}
.choice:focus-visible{outline:3px solid #173247;outline-offset:2px}

#roster{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:#0b5368;padding:0 6px 6px}
.playerTile{min-width:0;border:2px solid #a7bec2;border-radius:9px;background:#173e4d;color:white;padding:5px 2px;cursor:pointer;font:inherit}
.playerTile.current{background:#fff0a6;color:#173247;border-color:#e0ad36}
.playerName{display:block;font-size:clamp(11px,2.8vw,15px);font-weight:bold}
.playerHealth{display:block;font-size:11px}
.playerFriends{display:block;min-height:21px;font-size:19px;line-height:1.15;margin-top:3px}
.noFriends{font-size:10px;opacity:.8}
.cardIcon{font-size:52px;line-height:1.2;margin:8px}
.cardStats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}
.cardStats div{padding:8px;border-radius:9px;background:#ead39c}
.cardStats b{display:block}
.friendRow{background:#f4e4bd;padding:10px;border-radius:9px;margin:8px 0;text-align:left}
.friendRow h3{margin:0 0 4px}
.friendRow p{margin:4px 0;line-height:1.4}
#turn{width:100%;text-align:left;border:0;font:inherit;font-weight:bold;cursor:pointer}


/* Illustrated board. Gameplay controls stay outside the artwork. */
#mapWrap{display:grid;place-items:center;background:radial-gradient(ellipse at center,#20a6ba,#07546b);padding:5px;isolation:isolate}
#map{position:relative;display:block;flex:none;gap:0;overflow:visible;border-radius:16px;box-shadow:0 5px 22px #002b4480}
.islandArt{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:16px;pointer-events:none}
#map .region{position:absolute;transform:translate(-50%,-50%);width:var(--label-width,88px);height:auto;min-height:40px;padding:4px 3px;border:2px solid #664b2d;border-radius:9px;background:#fff3d6eb;color:#173247;box-shadow:0 3px 7px #17324766;overflow:visible;z-index:2;cursor:pointer}
#map .region h2{font-size:clamp(11px,2.8vw,16px);line-height:1.1}
#map .region .res{font-size:clamp(9px,2vw,11px);margin-top:2px}
#map .region.selected{outline:3px solid #ffdf63;outline-offset:2px}
#map .region.reachable{background:#e4ffe9;border:3px dashed #146d4b;box-shadow:0 0 0 3px #ffffffa0}
#map .region.reachable::after{right:-4px;top:-14px;padding:2px 4px;background:#17684c;color:white;font-size:10px}
#map .region.locked{opacity:1;filter:none;background:#cbd1d6eb;color:#324351}
.mapPawn{position:absolute;transform:translate(-50%,-50%);width:var(--pawn-size,38px);height:var(--pawn-size,38px);padding:0;border:2px solid var(--player-colour);border-radius:50%;background:#fff8de;box-shadow:0 3px 5px #0007;z-index:5;cursor:pointer;transition:left .55s ease-in-out,top .55s ease-in-out;overflow:visible}
.mapPawn img{width:100%;height:100%;object-fit:contain;display:block}
.mapPawn .pawnLetter{position:absolute;right:-3px;bottom:-4px;font-size:10px;font-weight:bold;padding:1px 4px;border-radius:9px;background:var(--player-colour);color:#fff;border:1px solid white}
.mapPawn.active{outline:3px solid #fff;outline-offset:1px;z-index:6}
.mapPawn.ko{filter:grayscale(1);opacity:.7}
.monsterPin{position:absolute;transform:translate(-50%,-50%);z-index:7;font-size:10px;font-weight:bold;background:#7b2024;color:white;border:2px solid #fff;border-radius:7px;padding:3px 5px;pointer-events:none;max-width:105px;text-align:center}
.rosterPortrait{float:left;width:30px;height:39px;object-fit:contain;pointer-events:none}
.playerTile{border-bottom:4px solid var(--player-colour,#a7bec2)}
.heroPortrait{height:145px;width:145px;object-fit:contain;display:block;margin:0 auto 5px;filter:drop-shadow(0 5px 3px #76502c33)}
#motionToggle{position:absolute;right:7px;bottom:5px;z-index:9;border:1px solid #f1d493;border-radius:20px;background:#073b4fe8;color:white;padding:6px 9px;min-height:32px;font:inherit;font-size:11px;cursor:pointer}
#mapFallback{position:absolute;top:8px;left:10%;right:10%;padding:5px;background:#fff3d6;z-index:8;font-size:11px;text-align:center}
.floatEffect{position:absolute;z-index:10;pointer-events:none;background:#fff4c9;color:#173247;padding:5px 8px;border-radius:20px;border:2px solid #b78a30;font-weight:bold;font-size:12px;animation:floatGain 1s ease-out both;white-space:nowrap}
@keyframes floatGain{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-45px)}}
.overlay.open .modal{animation:cardAppear .2s ease-out}
@keyframes cardAppear{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.portalHalo{position:absolute;left:49%;top:49%;width:16%;aspect-ratio:1;transform:translate(-50%,-50%);border:4px solid #85f8ed;box-shadow:0 0 14px #91fff3,inset 0 0 12px #69f3e0;border-radius:50%;z-index:1;display:none}
.portalActive .portalHalo{display:block;animation:portalGlow 2s ease-in-out infinite alternate}
@keyframes portalGlow{to{box-shadow:0 0 25px #c5fff9,inset 0 0 22px #69f3e0}}
.reduceMotion .mapPawn{transition:none}
.reduceMotion .modal,.reduceMotion .floatEffect,.reduceMotion .portalHalo{animation:none!important}
@media(prefers-reduced-motion:reduce){.mapPawn{transition:none}.modal,.floatEffect,.portalHalo{animation:none!important}}
@media(max-height:620px){.heroPortrait{height:82px;width:82px}.rosterPortrait{width:21px;height:30px}#roster .playerTile{padding:2px}.playerFriends{min-height:17px;font-size:16px}#motionToggle{font-size:10px;padding:3px 6px}}

@media(max-width:650px){.rosterPortrait{display:none}}

@media(orientation:landscape) and (max-height:550px){
 #game{display:grid;grid-template-columns:180px minmax(0,1fr);grid-template-rows:30px minmax(0,1fr) 100px;position:relative}
 header{grid-column:1/-1;grid-row:1;padding:4px;border-bottom-width:2px}header h1{font-size:19px}
 .status{grid-column:1;grid-row:2;grid-template-columns:1fr;align-content:start;padding:5px}
 #roster{grid-column:1;grid-row:3;grid-template-columns:repeat(2,minmax(0,1fr));padding:3px;gap:3px}
 #roster .playerTile{padding:2px;border-bottom-width:2px}.rosterPortrait{display:none}
 .playerName,.playerHealth{font-size:10px}.playerFriends{font-size:14px;min-height:15px;margin:0}.noFriends{font-size:9px}
 #mapWrap{grid-column:2;grid-row:2}
 .actions{grid-column:2;grid-row:3;padding:4px;gap:4px}.action{min-height:36px}
 #moveGuide{position:absolute;top:30px;left:180px;right:0;z-index:12;font-size:11px;padding:4px}
}


/* Opening story: reader-paced, with no automatic scene changes. */
#overlay.introOverlay{background:#062b3ef5;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.introOverlay .modal{width:min(900px,96vw);max-height:94dvh;padding:0;border-color:#cfaf68;background:#fff3d3}
.introScene{display:grid;grid-template-columns:1fr 1fr;text-align:left}
.introArt{width:100%;height:100%;min-height:280px;object-fit:cover}
.introCopy{padding:24px;align-self:center}
.introCopy h2{font-size:clamp(24px,5vw,38px);line-height:1.05}
.introCopy p{font-size:17px;line-height:1.5}
.introCopy .introChapter{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#72552a;font-weight:bold}
.introCrew{display:flex;gap:8px;justify-content:center}
.introCrew img{width:21%;height:90px;object-fit:contain}
@media(max-width:600px){.introScene{grid-template-columns:1fr}.introArt{height:25dvh;min-height:130px;object-position:50% 60%}.introCopy{padding:16px}.introCopy p{font-size:15px;margin:10px 0}.introCrew img{height:60px}}
@media(orientation:landscape) and (max-height:550px){.introScene{grid-template-columns:35% 65%}.introArt{height:100%;min-height:280px}.introCopy{padding:12px 20px}.introCopy p{font-size:14px;margin:7px 0}.introCopy h2{font-size:25px}.introCrew img{height:50px}.introCopy .choice{padding:8px;margin:5px 0}}


/* Lightweight scenery and action feedback. Effects never intercept touches. */
.scenery{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.cloud{position:absolute;top:5%;left:-25%;width:28%;height:9%;border-radius:50%;background:#fff8;filter:blur(6px);animation:cloudDrift 36s linear infinite}
.cloud.second{top:83%;animation-delay:-18s;animation-duration:48s;opacity:.5}
.wave{position:absolute;left:2%;top:77%;width:18%;height:5%;border-top:2px solid #dfffffb0;border-radius:50%;animation:waveWash 5s ease-in-out infinite}
.wave.second{left:82%;top:60%;animation-delay:-2.5s}
.snow{position:absolute;left:61%;top:5%;width:25%;height:27%;background:radial-gradient(circle,#fff 1px,transparent 2px) 0 0/17px 23px;opacity:.7;animation:snowFall 7s linear infinite}
@keyframes cloudDrift{to{transform:translateX(480%)}}
@keyframes waveWash{50%{transform:translateY(6px) scaleX(.8);opacity:.2}}
@keyframes snowFall{to{background-position:9px 46px}}
.rewardFlight{position:fixed;z-index:30;pointer-events:none;font-size:25px;filter:drop-shadow(0 2px 2px #102f48);animation:rewardFly .85s ease-in both}
@keyframes rewardFly{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.5);opacity:0}}
.spark{position:absolute;z-index:10;pointer-events:none;font-size:19px;animation:sparkBurst .8s ease-out both}
@keyframes sparkBurst{to{transform:translate(var(--sx),var(--sy)) rotate(35deg);opacity:0}}
.friendThumb{width:24px;height:24px;object-fit:contain;vertical-align:middle}
.kittyPortrait{width:150px;height:150px;object-fit:contain;animation:kittyHello .65s ease-out}
@keyframes kittyHello{0%{transform:translateY(20px) rotate(-8deg);opacity:0}70%{transform:translateY(-5px) rotate(3deg)}100%{transform:none;opacity:1}}
.discoveryArt{font-size:48px;animation:kittyHello .45s ease-out}
#saveNote{font-size:12px;color:#365d48}
.reduceMotion .scenery *,.reduceMotion .kittyPortrait,.reduceMotion .discoveryArt{animation:none!important}
.reduceMotion .cloud{display:none}
.reduceMotion .rewardFlight,.reduceMotion .spark{display:none}
@media(prefers-reduced-motion:reduce){.scenery *,.kittyPortrait,.discoveryArt{animation:none!important}.cloud,.rewardFlight,.spark{display:none}}
@media(max-height:550px){.kittyPortrait{width:85px;height:85px}}


/* Turn handoff stays usable while the character animation plays. */
.turnArrival{position:relative;margin:0 auto 8px;max-width:310px;overflow:hidden;border-radius:18px;background:linear-gradient(#d8eee9,#f3e7bc);border-bottom:4px solid #d0b77a}
.turnArrival .heroPortrait{height:120px;width:120px;margin:4px auto;animation:walkIntoTurn .9s ease-out both}
.turnArrival::after{content:"·  ·  ·  ·";position:absolute;bottom:3px;left:20%;right:20%;color:#b59662;font-size:22px;letter-spacing:12px;pointer-events:none}
@keyframes walkIntoTurn{0%{transform:translateX(-140px) rotate(-8deg);opacity:0}30%{transform:translateX(-80px) translateY(-8px) rotate(5deg);opacity:1}55%{transform:translateX(-40px) rotate(-5deg)}80%{transform:translateX(-10px) translateY(-7px) rotate(3deg)}100%{transform:none;opacity:1}}
.turnOrder{display:flex;justify-content:center;gap:6px;margin:8px 0}
.turnOrder span{padding:5px 6px;border-radius:9px;background:#e5d9bb;font-size:11px}
.turnOrder .now{background:var(--turn-colour,#2d6e5c);color:white;font-weight:bold}
.turnStart{position:sticky;bottom:-14px;background:var(--paper2);padding:8px 0 0;z-index:2}
.turnStart .choice{min-height:48px;margin-bottom:0}
.turnInstructions{font-size:14px;line-height:1.45}
.mapPawn.active .pawnArt{animation:activeStep 1.25s ease-in-out 3}
@keyframes activeStep{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3px) rotate(-5deg)}75%{transform:translateY(-3px) rotate(5deg)}}
.reduceMotion .turnArrival .heroPortrait,.reduceMotion .mapPawn.active .pawnArt{animation:none!important}
@media(prefers-reduced-motion:reduce){.turnArrival .heroPortrait,.mapPawn.active .pawnArt{animation:none!important}}
@media(max-height:650px){.turnArrival .heroPortrait{height:75px;width:75px}.turnRole{font-size:28px}.turnOrder{margin:5px 0}.turnInstructions{font-size:12px}.turnStart{bottom:-14px}.turnArrival{margin-bottom:4px}}


/* The visible outer trail matches the movement graph. */
.islandRoutes{position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:visible;pointer-events:none}
.islandRoutes path{fill:none;stroke:#f7ecc5;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:2 1.5;filter:drop-shadow(0 1px 1px #203c2b)}
.islandRoutes .centreRoute{stroke:#e8dbb9;stroke-width:.7;opacity:.35}
.islandRoutes .routeOpen{stroke:#a7ffd0;stroke-width:2.2;opacity:1}
#map .region.reachable{z-index:12}
#map.moving .mapPawn{pointer-events:none}
.moveChoices{display:flex;justify-content:center;gap:5px;margin-top:4px}
.moveChoices button{min-height:40px;flex:1;max-width:160px;border:2px solid #28684c;border-radius:8px;background:#f6fff0;color:#174330;font-size:12px;font-weight:bold;padding:5px;cursor:pointer}
.exploreScene{position:relative;isolation:isolate;height:clamp(180px,32dvh,290px);overflow:hidden;border:3px solid #ac8a46;border-radius:13px;background:#287987;margin-bottom:10px}
.terrainDetail{position:absolute;width:100%;height:auto;left:50%;top:50%;max-width:none;transform-origin:var(--scene-x) var(--scene-y);animation:terrainDive 1.3s cubic-bezier(.2,.65,.25,1) both}
@keyframes terrainDive{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(calc(0% - var(--scene-x)),calc(0% - var(--scene-y))) scale(2.5)}}
.terrainShade{position:absolute;inset:0;background:linear-gradient(#061d3330,transparent 35%,#062b4570);pointer-events:none}
.terrainCaption{position:absolute;top:8px;left:8px;background:#123b45df;color:#fff3d6;border-radius:9px;font-size:12px;font-weight:bold;padding:6px 9px}
.rewardPop{position:absolute;left:50%;top:55%;width:108px;height:108px;border:4px solid #fff0ab;border-radius:24px;background:radial-gradient(#fffdf0,#f5ce6c);box-shadow:0 0 35px #ffe495ab,0 8px 16px #001e3377;display:flex;align-items:center;justify-content:center;font-size:64px;animation:rewardSpring .85s .65s cubic-bezier(.2,.8,.2,1) both}
.rewardPop img{width:96px;height:96px;object-fit:contain;animation:none}
@keyframes rewardSpring{0%{opacity:0;transform:translate(-50%,70%) scale(.15) rotate(-18deg)}55%{opacity:1;transform:translate(-50%,-75%) scale(1.18) rotate(7deg)}78%{transform:translate(-50%,-42%) scale(.96) rotate(-3deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
.rewardSparkle{position:absolute;left:50%;top:55%;color:#fff4a5;font-size:25px;animation:rewardGlitter 1.15s .75s ease-out both;pointer-events:none}
@keyframes rewardGlitter{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}25%{opacity:1}100%{opacity:0;transform:translate(var(--spark-x),var(--spark-y)) scale(1.2)}}
.discoveryCopy{font-size:16px;line-height:1.45}
.exploreActions{position:sticky;bottom:-14px;background:var(--paper2);padding:3px 0;z-index:3}
.reduceMotion .terrainDetail{animation:none;transform:translate(calc(0% - var(--scene-x)),calc(0% - var(--scene-y))) scale(2.5)}
.reduceMotion .rewardPop{animation:none;transform:translate(-50%,-50%)}.reduceMotion .rewardSparkle{display:none}
@media(prefers-reduced-motion:reduce){.terrainDetail{animation:none;transform:translate(calc(0% - var(--scene-x)),calc(0% - var(--scene-y))) scale(2.5)}.rewardPop{animation:none;transform:translate(-50%,-50%)}.rewardSparkle{display:none}}
@media(orientation:landscape) and (max-height:550px){#moveGuide{font-size:10px;padding:3px}.moveChoices{margin-top:2px}.moveChoices button{min-height:32px;padding:3px}.exploreCut{display:grid;grid-template-columns:48% 1fr;gap:12px;align-items:center}.exploreScene{height:230px;margin:0}.discoveryCopy{font-size:14px}.exploreActions{position:static}}

@media(orientation:landscape) and (max-height:550px){#moveGuide{grid-column:1;grid-row:2;position:relative;align-self:end;top:auto;left:auto;right:auto;z-index:6}.moveChoices button{font-size:10px;min-height:40px}}

.playerOwner{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:bold;color:inherit;margin:2px 0}

.setupNames input,.roleAssignment select{width:100%;min-height:44px;border:2px solid #9b895f;border-radius:8px;background:#fffdf3;color:#173247;font:inherit;font-size:16px;padding:7px;margin-top:4px}
.roleAssignment{display:grid;grid-template-columns:45px 1fr;align-items:center;text-align:left;gap:8px;border-top:1px solid #d8c499;padding:7px 0}
.roleAssignment img{width:42px;height:58px;object-fit:contain}
.setupError{font-size:14px;color:#992e24;font-weight:bold}
.turnHuman{font-size:clamp(24px,7vw,38px);overflow-wrap:anywhere}
.turnCharacter{font-size:20px;font-weight:bold;margin:7px 0}
.turnOrder small{display:block;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(orientation:landscape) and (max-height:550px){.playerOwner{font-size:9px;margin:0}.turnHuman{font-size:26px}.turnCharacter{font-size:16px}}


.actions{grid-template-columns:repeat(5,minmax(0,1fr))}
.action{font-size:10px}
.modal.wideModal{width:min(780px,96vw)}
.battleHeading{display:grid;grid-template-columns:65px 1fr;gap:8px;align-items:center;text-align:left}
.battleHeading h2{font-size:24px;margin:0}.battleHeading p{font-size:12px;margin:5px 0}
.battleEnemy{font-size:54px;display:inline-block;animation:enemyArrive .35s ease-out}
@keyframes enemyArrive{from{transform:scale(.3) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.battleTeam,.endingTeam{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:10px 0}
.battleHero{min-width:0;background:#e8debd;border:2px solid #b8a470;border-radius:10px;padding:4px 2px;font-size:11px}
.battleHero.current{border-color:#15785f;background:#e4f4d5;box-shadow:0 0 0 2px #38846a}
.battleHero img{height:48px;width:100%;object-fit:contain;display:block}.battleHero b,.battleHero small,.battleHero span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.battleHero small{font-size:10px}.battleActions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.battleActions .choice{margin:0;min-height:47px;padding:7px;font-size:12px}.choice:disabled{opacity:.42;cursor:default}
.battleHint{font-size:12px;line-height:1.4}.battleLog{font-size:12px;text-align:left;background:#eadfc0;border-radius:9px;padding:7px;max-height:100px;overflow:auto}.battleLog div+div{margin-top:4px}
.packRow{border-bottom:1px solid #cbb47c;text-align:left;font-size:14px;padding:7px}.packRow p{line-height:1.5}
.portalEmblem{font-size:72px;animation:portalGlow 2s ease-in-out infinite alternate}
.endingScene{position:relative;height:170px;overflow:hidden;border-radius:12px;background:#197686}.endingScene img{width:100%;height:100%;object-fit:cover;object-position:center}.endingPortal{position:absolute;inset:20px 0;text-align:center;font-size:110px;filter:drop-shadow(0 0 18px #a9ffee);animation:endingGlow 2s ease-in-out infinite alternate}
@keyframes endingGlow{to{transform:scale(1.1);filter:drop-shadow(0 0 30px #d8fff8)}}
.endingTeam img{width:100%;height:78px;object-fit:contain}.endingTeam b,.endingTeam small{display:block;font-size:11px;overflow-wrap:anywhere}
.reduceMotion .battleEnemy,.reduceMotion .endingPortal,.reduceMotion .portalEmblem{animation:none!important}
@media(prefers-reduced-motion:reduce){.battleEnemy,.endingPortal,.portalEmblem{animation:none!important}}
@media(max-width:650px){.actions{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(orientation:landscape) and (max-height:550px){.battleScreen{display:grid;grid-template-columns:.9fr 1.1fr;gap:14px}.battleEnemy{font-size:42px}.battleHeading h2{font-size:19px}.battleHero img{height:38px}.battleHero{font-size:10px}.battleScreen h3{margin:4px}.battleActions .choice{min-height:40px;font-size:11px}.battleScreen p{font-size:11px;margin:6px 0}.endingScene{height:90px}.endingPortal{font-size:60px;inset:5px}.endingTeam img{height:45px}}

.modalOpen .scenery *,.modalOpen .mapPawn .pawnArt{animation-play-state:paused}
.packGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;text-align:left}.itemCard{padding:10px;background:#efe2b9;border:2px solid #c1a15d;border-radius:12px;min-width:0}.itemCard b,.itemCard small{display:block}.itemCard small{font-size:12px;line-height:1.4;margin-top:5px}.itemCard .choice{font-size:12px}.enemyResponse{background:#572e50;color:#fff5d8;border:3px solid #e4a965;border-radius:14px;padding:14px}.enemyResponse h2{color:#ffe6a4}.enemyResponse p{font-size:17px;line-height:1.4}.packTabs{display:flex;gap:6px;position:sticky;top:-14px;background:var(--paper2);padding:5px 0;z-index:2}.packTabs button{flex:1}.bossProgress{padding:8px;background:#e5d3f0;border-radius:9px}.battleHero.weakened{border-style:dashed}.battleHint{overflow-wrap:anywhere}@media(max-width:420px){.packGrid{grid-template-columns:1fr}.battleHeading h2{font-size:21px}}

<body>
<div id="game">
  <header>
    <h1>THE LOST HELICOPTER JOURNAL</h1>
    <div class="sub">Digital Prototype v0.2.1 · Cooperative Island Adventure</div>
  </header>

  <section class="status">
    <div class="statusBox">
      <button type="button" id="turn" aria-label="Open active player card"></button>
      <div id="teamline"></div>
    </div>
    <div class="statusBox">
      <div id="mission"></div>
    </div>
  </section>

  <nav id="roster" aria-label="Player cards and friends"></nav>
  <div id="moveGuide" role="status" aria-live="polite"></div>
  <main id="mapWrap">
    <div id="toast"></div>
    <div id="map"></div><button type="button" id="motionToggle" aria-label="Reduce animations" aria-pressed="false">Motion: on</button>
  </main>

  <nav class="actions" aria-label="Game actions">
    <button class="action" data-action="move">MOVE</button>
    <button class="action" data-action="explore">EXPLORE</button>
    <button class="action" data-action="gather">GATHER</button>
    <button class="action" data-action="craft">CRAFT</button>
    <button class="action" data-action="ability">ABILITY</button>
    <button class="action" data-action="help">HELP</button>
    <button class="action secondary" data-action="journal">JOURNAL</button>
    <button class="action secondary" data-action="portal">PORTAL</button><button class="action secondary" data-action="pack">PACK</button><button class="action secondary" data-action="end">END TURN</button>
  </nav>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true" tabindex="-1"></div>
</div>

<script>
"use strict";
const regions={
  Beach:{res:"Food",adj:["Forest","Desert","Centre"]},
  Forest:{res:"Wood",adj:["Beach","Cave","Centre"]},
  Desert:{res:"Gold",adj:["Ice","Beach","Centre"]},
  Ice:{res:"Ice",adj:["Desert","Cave","Centre"]},
  Cave:{res:"String",adj:["Forest","Ice","Centre"]},
  Centre:{res:null,adj:["Beach","Forest","Desert","Ice","Cave"]}
};
const roleNames=["Explorer","Hunter","Builder","Medic"];
const players=roleNames.map(role=>({role,loc:"Beach",hp:5,ko:false,abilityUsed:false}));
let active=0, actions=3, round=1, moveMode=false, gameOver=false;
let explorerSteps=0,builderCrafts=0;
let res={Gold:0,Wood:0,String:0,Food:4,Ice:0};
let parts={Core:false,Crystal:false,Ring:false};
let recruited={Kitty:false,Fred:false,"Bla Bla":false};
let discoveries=new Set(["Beach"]);
let centreUnlocked=false, teleporter=false, finalRounds=0;
let monsters={Eyes:null,Watcher:null,EvilKitty:null};
let eyeMarks=[0,0,0,0];
let inventory={Tool:0,Armour:0,"Healing Kit":1};

const $=id=>document.getElementById(id);
let modalDismissible=true, modalReturnFocus=null;

const friendInfo={
  Kitty:{icon:"🐱",title:"Kitty the island cat",description:"A brave little cat has joined your adventure. Keep Kitty close while you explore the island together."},
  Fred:{icon:"🎨",title:"Fred the creative friend",description:"Meet Fred! This creative island friend loves drawing and discovering new things. Fred is ready to travel with you."},
  "Bla Bla":{icon:"💜",title:"Bla Bla the purple friend",description:"A friendly purple blob has found your team! Bla Bla brings kindness and company to your island adventure."}
};
const friendOwners={Kitty:null,Fred:null,"Bla Bla":null};
const roleInfo={
  Explorer:{icon:"🧭",description:"Lead the way into new regions and search for discoveries.",ability:"TRAILBLAZE: once per turn, spend 1 action to move through up to two connected regions. Choose each step on the map. You may stop after one."},
  Hunter:{icon:"🎒",description:"Collect supplies to help the whole team survive.",ability:"HARVEST: once per turn, choose a regional material, ammunition, or item and collect 2 bundles for 1 action. A Tool adds 1 bundle. Open ABILITY to choose."},
  Builder:{icon:"🔧",description:"Help the team collect materials and prepare for escape.",ability:"DOUBLE CRAFT: once per turn, spend 1 action to craft up to two items. Pay the material cost of each item. You can choose the same recipe twice."},
  Medic:{icon:"➕",description:"Watch your team's Hearts and help hurt survivors.",ability:"CARE: once per turn, spend 1 action to restore up to 3 Hearts to yourself or one teammate in your region, up to 5 Hearts. Can rescue a knocked-out teammate."}
};

const SAVE_KEY="lost-helicopter-save-v1";
let saveEnabled=false,saveQueued=false,saveStatus="Progress saves on this browser after you start.";
let pendingExplore=null,pendingCraft=false,outcome=null;
function snapshotGame(){
 return {schema:1,party,gear,battle,encounterStamp,battlesWon,journey,players,active,actions,round,moveMode,gameOver,explorerSteps,builderCrafts,res,parts,recruited,discoveries:[...discoveries],centreUnlocked,teleporter,finalRounds,monsters,eyeMarks,inventory,friendOwners,reduceMotion,pendingExplore,pendingCraft,outcome};
}
function validSave(s){
 const count=(n,max=100000)=>Number.isInteger(n)&&n>=0&&n<=max;
 const bool=v=>typeof v==="boolean";
 const counts=(o,keys)=>o&&keys.every(k=>count(o[k]));
 const flags=(o,keys)=>o&&keys.every(k=>bool(o[k]));
 return s&&s.schema===1&&validCombatSave(s)&&(s.party==null||validParty(s.party))&&Array.isArray(s.players)&&s.players.length===4
 &&s.players.every((p,i)=>p&&p.role===roleNames[i]&&Object.hasOwn(regions,p.loc)&&count(p.hp,5)&&bool(p.ko)&&p.ko===(p.hp===0)&&bool(p.abilityUsed))
 &&count(s.active,3)&&count(s.actions,3)&&count(s.round)&&s.round>=1
 &&["moveMode","gameOver","centreUnlocked","teleporter","reduceMotion","pendingCraft"].every(k=>bool(s[k]))
 &&count(s.explorerSteps,2)&&count(s.builderCrafts,2)&&count(s.finalRounds,3)
 &&counts(s.res,["Gold","Wood","String","Food","Ice"])&&counts(s.inventory,["Tool","Armour","Healing Kit"])
 &&flags(s.parts,["Core","Crystal","Ring"])&&flags(s.recruited,["Kitty","Fred","Bla Bla"])
 &&s.friendOwners&&["Kitty","Fred","Bla Bla"].every(k=>(s.friendOwners[k]===null||count(s.friendOwners[k],3))&&s.recruited[k]===(s.friendOwners[k]!==null))
 &&s.monsters&&["Eyes","Watcher","EvilKitty"].every(k=>s.monsters[k]===null||Object.hasOwn(regions,s.monsters[k]))
 &&Array.isArray(s.eyeMarks)&&s.eyeMarks.length===4&&s.eyeMarks.every(n=>count(n))
 &&Array.isArray(s.discoveries)&&s.discoveries.length<200&&s.discoveries.every(v=>typeof v==="string"&&v.length<100&&!/[<>&]/.test(v))
 &&(s.pendingExplore===null||count(s.pendingExplore,exploration.length-1))
 &&(s.outcome===null||["won","lost"].includes(s.outcome))
 &&(!s.pendingCraft||(s.players[s.active].role==="Builder"&&s.builderCrafts===1&&s.players[s.active].abilityUsed))
 &&(!s.explorerSteps||s.players[s.active].role==="Explorer");
}
function writeSave(){
 if(!saveEnabled)return;
 try{localStorage.setItem(SAVE_KEY,JSON.stringify(snapshotGame()));saveStatus="Progress saved on this browser.";}
 catch{saveStatus="Saving unavailable. Keep this tab open to continue playing.";}
 if($("saveNote"))$("saveNote").textContent=saveStatus;
}
function queueSave(){
 if(!saveEnabled||saveQueued)return;
 saveQueued=true;queueMicrotask(()=>{saveQueued=false;writeSave();});
}
function loadSave(){
 try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;const s=JSON.parse(raw);if(validSave(s))return s;saveStatus="The old save could not be read. Start a new adventure.";}
 catch{saveStatus="Saving unavailable or the saved adventure could not be read.";}
 return null;
}
function applySave(s){
 party=s.party||null;
 players.forEach((p,i)=>Object.assign(p,s.players[i]));
 ({active,actions,round,moveMode,gameOver,explorerSteps,builderCrafts,res,parts,recruited,centreUnlocked,teleporter,finalRounds,monsters,eyeMarks,inventory,reduceMotion,pendingExplore,pendingCraft,outcome}=s);
 Object.assign(friendOwners,s.friendOwners);discoveries=new Set(s.discoveries);restoreCombatState(s);
 travelBusy=false;saveEnabled=true;render();
}
function continueSaved(){
 closeModal();
 if(gameOver){if(outcome==="won")win();else lose("This adventure has ended. Try again together.");return;}
 if(battle){showBattle();return;}
 if(pendingExplore!==null){revealExploration();return;}
 if(pendingCraft){showCraft(true);return;}
 if(players[active].loc==="Centre"&&allParts()){offerPortal();return;}
 if(checkEncounter())return;
 toast(moveMode?"Continue your move by choosing a connected region.":"Adventure resumed. Your actions and supplies are unchanged.");
}
function confirmNewGame(cancel){
 showModal('<h2>Start a new adventure?</h2><p>This replaces the adventure saved on this browser. Your current progress will be lost.</p><button class="choice" id="confirmNew">START NEW ADVENTURE</button><button class="choice alt" id="cancelNew">KEEP CURRENT ADVENTURE</button>',false);
 $("cancelNew").addEventListener("click",cancel);
 $("confirmNew").addEventListener("click",()=>{
   saveEnabled=false;
   try{localStorage.removeItem(SAVE_KEY);}catch{}
   location.reload();
 });
}
function showResume(s){
 showModal('<h2>Your island adventure is waiting</h2><p class="guideCopy">Round '+s.round+' · <b>'+(s.party?escapeText(s.party.names[s.party.owners[s.active]])+' — ':'')+s.players[s.active].role+'</b><br>'+s.actions+' actions left · '+s.players[s.active].loc+'</p><p>Continue with the same supplies, friends, and special abilities.</p><button class="choice" id="resumeGame">CONTINUE ADVENTURE</button><button class="choice alt" id="newSavedGame">NEW ADVENTURE</button>',false);
 $("resumeGame").addEventListener("click",()=>{applySave(s);if(party)continueSaved();else showPartySetup("resume");});
 $("newSavedGame").addEventListener("click",()=>confirmNewGame(()=>showResume(s)));
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")writeSave();});
window.addEventListener("pagehide",writeSave);


let party=null;
function escapeText(value){return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}
function cleanName(value){return String(value).replace(/[\u0000-\u001f\u007f]/g,"").trim().slice(0,24);}
function validParty(value){
 return value&&Array.isArray(value.names)&&value.names.length>=1&&value.names.length<=4
 &&value.names.every(n=>typeof n==="string"&&n===cleanName(n)&&n.length>0)
 &&new Set(value.names.map(n=>n.toLocaleLowerCase())).size===value.names.length
 &&Array.isArray(value.owners)&&value.owners.length===4
 &&value.owners.every(i=>Number.isInteger(i)&&i>=0&&i<value.names.length)
 &&value.names.every((_,i)=>value.owners.includes(i));
}
function controller(i){return party?party.names[party.owners[i]]:"Player";}
function controllerHTML(i){return escapeText(controller(i));}
function showPartySetup(mode="new"){
 let draft=party?{names:[...party.names],owners:[...party.owners]}:{names:["Player 1"],owners:[0,0,0,0]};
 function draw(){
  showModal('<h2>Who is playing?</h2><p class="setupCopy">Play with <b>1–4 people on this device</b>. All four characters take a turn. One person can control several characters.</p><div class="playerCounts" aria-label="Number of people">'+[1,2,3,4].map(n=>'<button type="button" data-count="'+n+'" aria-pressed="'+(n===draft.names.length)+'">'+n+(n===1?' player':' players')+'</button>').join('')+'</div><form id="partyForm"><div class="setupNames">'+draft.names.map((name,i)=>'<label for="human'+i+'">Player '+(i+1)+' name<input id="human'+i+'" name="human'+i+'" maxlength="24" autocomplete="off" autocapitalize="words" value="'+escapeText(name)+'"></label>').join('')+'</div><p class="setupCopy"><b>Choose who controls each character.</b><br>Everyone needs at least one character.</p>'+roleNames.map((role,i)=>'<div class="roleAssignment">'+portrait(role,'')+'<label for="owner'+i+'">'+role+'<select id="owner'+i+'" name="owner'+i+'">'+draft.names.map((name,j)=>'<option value="'+j+'"'+(draft.owners[i]===j?' selected':'')+'>'+escapeText(name||'Player '+(j+1))+'</option>').join('')+'</select></label></div>').join('')+'<p class="setupError" id="partyError" role="alert"></p><button class="choice" type="submit">'+(mode==="new"?'BEGIN ADVENTURE':'SAVE PLAYERS')+'</button>'+(mode==="edit"?'<button class="choice alt" type="button" id="cancelParty">CANCEL CHANGES</button>':'')+'<p class="setupCopy">Names stay with your saved adventure in this browser. This mode is pass-and-play, not online across separate phones.</p></form>',false);
  $("modal").querySelectorAll("[data-count]").forEach(button=>button.addEventListener("click",()=>{
   const n=Number(button.dataset.count);
   if(n===draft.names.length)return;
   draft.names=Array.from({length:n},(_,i)=>draft.names[i]||"Player "+(i+1));
   draft.owners=roleNames.map((_,i)=>i%n);draw();
  }));
  draft.names.forEach((_,i)=>$("human"+i).addEventListener("input",()=>{
   draft.names[i]=$("human"+i).value;
   roleNames.forEach((_,j)=>$("owner"+j).options[i].textContent=cleanName(draft.names[i])||"Player "+(i+1));
  }));
  roleNames.forEach((_,i)=>$("owner"+i).addEventListener("change",()=>{draft.owners[i]=Number($("owner"+i).value);}));
  $("partyForm").addEventListener("submit",event=>{
   event.preventDefault();
   const candidate={names:draft.names.map(cleanName),owners:[...draft.owners]};
   if(candidate.names.some(n=>!n)){$("partyError").textContent="Enter a name for every player.";return;}
   if(new Set(candidate.names.map(n=>n.toLocaleLowerCase())).size!==candidate.names.length){$("partyError").textContent="Use different names, or add an initial so everyone is easy to identify.";return;}
   if(!validParty(candidate)){$("partyError").textContent="Give every player at least one character.";return;}
   party=candidate;closeModal();render();
   if(mode==="new")showIntro();
   else if(mode==="resume")continueSaved();
   else showJournal();
  });
  if(mode==="edit")$("cancelParty").addEventListener("click",showJournal);
 }
 draw();
}

function ownedFriends(i){return Object.keys(friendOwners).filter(name=>friendOwners[name]===i);}
function friendIcons(i){
  const names=ownedFriends(i);
  return names.length?names.map(name=>'<span role="img" aria-label="'+name+'" title="'+name+'">'+friendArt(name)+'</span>').join(' '):'<span class="noFriends">No friends yet</span>';
}
function renderRoster(){
  $("roster").innerHTML=players.map((p,i)=>'<button type="button" class="playerTile '+(i===active?'current':'')+'" data-player="'+i+'" aria-label="Open '+p.role+' player card">'+portrait(p.role,'rosterPortrait')+'<span class="playerName">'+(i===active?'▶ ':'')+p.role+'</span><span class="playerOwner" title="'+controllerHTML(i)+'">'+controllerHTML(i)+'</span><span class="playerHealth">'+(p.ko?'Knocked out':'♥ '+p.hp+'/5')+'</span><span class="playerFriends">'+friendIcons(i)+'</span></button>').join('');
  $("roster").querySelectorAll("[data-player]").forEach(button=>{button.style.setProperty("--player-colour",playerColours[Number(button.dataset.player)]);button.addEventListener("click",()=>showPlayer(Number(button.dataset.player)));});
}
function showPlayer(i){
  const p=players[i], info=roleInfo[p.role], friends=ownedFriends(i);
  showModal(portrait(p.role,'heroPortrait')+'<h2>'+p.role+' player card</h2><p><b>Played by '+controllerHTML(i)+'</b></p><p>'+info.description+'</p><div class="cardStats"><div><b>Health</b>♥ '+p.hp+' / 5</div><div><b>Location</b>'+p.loc+'</div><div><b>Status</b>'+(p.ko?'Knocked out — needs rescue':i===active?'Active player':'Waiting for their turn')+'</div><div><b>'+(i===active?'Actions left':'Actions per turn')+'</b>'+(i===active?actions:3)+'</div></div><p><b>Ability:</b> '+info.ability+'</p><p><b>Ability status:</b> '+(i===active?(p.abilityUsed?'Used this turn':'Ready this turn'):'Available on their next turn')+'</p><p><b>Eye marks:</b> '+eyeMarks[i]+'</p><h3>Current friends</h3>'+(friends.length?friends.map(name=>'<section class="friendRow"><h3>'+friendArt(name,true)+' '+name+'</h3><p>'+friendInfo[name].description+'</p><p>Travels with '+p.role+'.</p></section>').join(''):'<p>No friends yet. Try exploring!</p>')+weaponCard(i)+'<p><small>Friends are companions in this prototype; they do not have separate Hearts or usable abilities yet.</small></p><h3>Items available to this player</h3><p>Items and supplies are shared by the whole team.</p>'+ownedItemCards(false)+'<p><small>Tools are used on the next Gather. Armour blocks the next monster hit. Healing Kits stay in the pack until you use them.</small></p><div class="chips">'+Object.entries(res).map(([name,count])=>'<span class="chip">'+name+': '+count+'</span>').join('')+'</div><button class="choice alt" id="closePlayer">BACK TO ISLAND</button>');
  $("closePlayer").addEventListener("click",closeModal);
}

  if(!regions[p.loc].adj.includes(name)){toast(name+" is not connected to "+p.loc+".");return;}

  if(a==="pack"){showPack();return;}

function performAction(a){
  if(gameOver || $("overlay").classList.contains("open"))return;
  if(a==="journal"){showJournal();return;}
  if(a==="end"){endTurn();return;}
  if(players[active].ko){toast("This survivor is Knocked Out and needs Help.");return;}
  if(a==="move"){explorerSteps=0;moveMode=!moveMode; toast(moveMode?"Tap a connected region to move.":"Move cancelled.");render();return;}

  if(a==="ability"){useAbility();return;}
  if(a==="help"){doHelp();return;}
}

  {name:"Tool",cost:{Wood:1,String:1},desc:"Your next Gather gives +1 resource."},
  {name:"Armour",cost:{Gold:1,Wood:1},desc:"Automatically blocks the next monster damage."},
  {name:"Healing Kit",cost:{Food:1,String:1},desc:"Store in the pack. Heal or revive a teammate for 3 Hearts."}
];
function showCraft(special=false){
  pendingCraft=special&&builderCrafts===1;
  const second=special&&builderCrafts===1;
  if(!second&&actions<=0){toast("No actions left.");return;}
  let html=special
    ? "<h2>DOUBLE CRAFT</h2><p>"+(second?"First item crafted! Choose a second item for no extra action.":"Craft up to two items using 1 action and your once-per-turn ability.")+"</p><p>Pay the material cost for each item. You may choose the same recipe twice.</p>"
    : "<h2>Craft</h2><p>Choose a recipe. The action is spent only if crafting succeeds.</p>";
  html+='<p id="craftFeedback" role="status"></p>';
  recipes.forEach((r,i)=>{
    const c=Object.entries(r.cost).map(([k,v])=>v+" "+k).join(" + ");
    html+='<button class="choice craftChoice" data-i="'+i+'">'+r.name+'<br><small>'+c+' · '+r.desc+'</small></button>';
  });
  html+='<button class="choice alt" id="closeCraft">'+(second?'FINISH CRAFTING':'Cancel')+'</button>';
  showModal(html);
  document.querySelectorAll(".craftChoice").forEach(b=>b.addEventListener("click",()=>make(Number(b.dataset.i),special)));
  $("closeCraft").addEventListener("click",closeModal);
}
function make(i,special=false){
  const r=recipes[i];
  if(!Object.entries(r.cost).every(([k,v])=>res[k]>=v)){
    $("craftFeedback").textContent="Not enough materials for "+r.name+". Choose another recipe or finish.";return;
  }
  if(special){
    if(builderCrafts===0){if(!spendAbility())return;}
    else if(builderCrafts!==1)return;
    builderCrafts++;
  }else if(!spendAction())return;
  Object.entries(r.cost).forEach(([k,v])=>res[k]-=v);
  inventory[r.name]++;discoveries.add(r.name);closeModal();
  toast(r.name+" crafted and stored in the pack.");visualGain(r.name+" crafted",active);burst("✦");
  render();
  if(special&&builderCrafts===1)showCraft(true);
}
function spendAbility(){
  if(players[active].abilityUsed){toast("Special ability already used this turn.");return false;}
  if(!spendAction())return false;
  players[active].abilityUsed=true;return true;
}
function useAbility(){
  const p=players[active];
  if(p.abilityUsed||actions<=0||p.ko||gameOver)return;
  if(p.role==="Explorer"){
    explorerSteps=2;moveMode=true;
    toast("Choose your first connected region. Two moves cost 1 action.");render();return;
  }
  if(p.role==="Hunter"){showHarvest();return;}
  if(p.role==="Builder"){builderCrafts=0;showCraft(true);return;}
  if(p.role==="Medic"){
    const targets=players.map((target,i)=>({target,i})).filter(x=>x.target.loc===p.loc&&x.target.hp<5);
    showModal('<h2>CARE · Restore up to 3 Hearts</h2><p>Choose yourself or one teammate here. Healing stops at 5 Hearts. A knocked-out teammate is rescued with 3 Hearts.</p>'+(targets.length?targets.map(({target,i})=>'<button class="choice medicTarget" data-player="'+i+'">'+target.role+' · ♥ '+target.hp+'/5 → '+Math.min(5,target.hp+3)+'/5</button>').join(''):'<p>No one here needs healing. Your action and ability will not be spent.</p>')+'<button class="choice alt" id="cancelHeal">BACK TO ISLAND</button>');
    $("modal").querySelectorAll(".medicTarget").forEach(b=>b.addEventListener("click",()=>{
      const i=Number(b.dataset.player);
      if(players[i].loc!==p.loc||players[i].hp>=5)return;
      if(!spendAbility())return;
      closeModal();heal(i,3);render();
    }));
    $("cancelHeal").addEventListener("click",closeModal);
  }
}
function doHelp(){
  const candidates=players.map((p,i)=>({p,i})).filter(x=>x.i!==active&&x.p.loc===players[active].loc&&(x.p.hp<5||x.p.ko));
  if(!candidates.length){toast("No teammate here needs Help.");return;}
  if(!spendAction())return;
  const t=candidates[0];
  if(t.p.ko){t.p.hp=2;t.p.ko=false;toast(`${t.p.role} was rescued with 2 Hearts!`);}
  else heal(t.i,1);
  render();
}
function monsterDamage(i,n=1){
  if(inventory.Armour>0){inventory.Armour--;toast("Armour blocked the monster hit!");return;}
  players[i].hp=Math.max(0,players[i].hp-n);
  if(players[i].hp===0){players[i].ko=true;toast(`${players[i].role} is Knocked Out!`);}
}
function islandPhase(){
  toast("Island phase...");
  const roll=Math.random();
  if(roll<.25&&res.Food>0){res.Food--;toast("Storm: the team loses 1 Food.");}
  else if(roll<.5){res.Food++;toast("Supply wash-up: +1 Food.");}
  else if(roll<.7){toast("Calm weather. Nothing happens.");}

  if(players.every(p=>p.ko)) lose("The whole team was Knocked Out.");
}
function endTurn(){
  if(gameOver||battle)return;
  if(teleporter&&everyoneAtPortal()){if(portalCleared())win();else offerPortal();return;}
  if(players.every(p=>p.ko)){lose("The whole team was knocked out.");return;}
  const previousController=party?party.owners[active]:null;
  moveMode=false;
  active++;
  while(active<players.length&&players[active].ko) active++;
  if(active>=players.length){
    active=0;
    while(active<players.length&&players[active].ko) active++;
    islandPhase();round++;
    if(teleporter&&!gameOver){
      finalRounds--;
      if(finalRounds<=0){
        if(everyoneAtPortal()){if(portalCleared())win();else {finalRounds=1;offerPortal();return;}}
        else lose("The portal closed before everyone reached the Centre.");
      }
    }
  }
  if(gameOver){active=Math.min(active,players.length-1);render();return;}
  if(players[active].ko){
    const next=players.findIndex(p=>!p.ko);
    if(next<0){lose("The whole team was Knocked Out.");return;}
    active=next;
  }
  actions=3;players[active].abilityUsed=false;explorerSteps=0;builderCrafts=0;render();showTurn(previousController);
}
function showJournal(){
  const friendText=Object.entries(recruited).filter(x=>x[1]).map(x=>friendInfo[x[0]].icon+" "+x[0]+" ("+players[friendOwners[x[0]]].role+")").join(", ")||"None yet";
  showModal(`<h2>Adventure Journal</h2>
    <div class="chips">${[...discoveries].map(x=>`<span class="chip">✓ ${x}</span>`).join("")}</div>
    <div class="journalList"><b>Friends:</b> ${friendText}<br><b>Inventory:</b> Tool ${inventory.Tool}, Armour ${inventory.Armour}<br><b>Eye Marks:</b> ${players.map((p,i)=>`${p.role} ${eyeMarks[i]}`).join(" · ")}</div>
    <p id="saveNote"></p><button class="choice" id="editParty">PLAYERS &amp; CHARACTER ASSIGNMENTS</button><button class="choice alt" id="newAdventure">START A NEW ADVENTURE</button><button class="choice" id="replayIntro">READ THE OPENING STORY</button><button class="choice alt" id="closeJournal">BACK TO ISLAND</button>`);
  $("closeJournal").addEventListener("click",closeModal);
  $("replayIntro").addEventListener("click",()=>showIntro(0,true));
  $("saveNote").textContent=saveStatus;
  $("newAdventure").addEventListener("click",()=>confirmNewGame(showJournal));
  $("editParty").addEventListener("click",()=>showPartySetup("edit"));
}

function showModal(html,dismissible=true){
  queueSave();
  modalReturnFocus=document.activeElement;modalDismissible=dismissible;
  $("modal").innerHTML=html;
  $("modal").classList.toggle("wideModal",html.includes("battleTeam")||html.includes("endingTeam"));
  const heading=$("modal").querySelector("h2");
  if(heading){heading.id="modalTitle";$("modal").setAttribute("aria-labelledby","modalTitle");}
  else $("modal").removeAttribute("aria-labelledby");
  document.documentElement.classList.add("modalOpen");$("overlay").classList.add("open");$("game").inert=true;$("modal").scrollTop=0;$("modal").focus({preventScroll:true});
}
function closeModal(){
  queueTurnAdvance();
  if($("closeCraft"))pendingCraft=false;
  queueSave();
  document.documentElement.classList.remove("modalOpen");$("overlay").classList.remove("open");$("game").inert=false;
  if(modalReturnFocus&&modalReturnFocus.isConnected)modalReturnFocus.focus();
}
document.addEventListener("keydown",e=>{
  if(!$("overlay").classList.contains("open"))return;
  if(e.key==="Escape"&&modalDismissible){e.preventDefault();closeModal();}
  if(e.key==="Tab"){
    const buttons=[...$("modal").querySelectorAll("button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled)")];
    if(!buttons.length){e.preventDefault();return;}
    const first=buttons[0],last=buttons[buttons.length-1];
    if(e.shiftKey&&(document.activeElement===first||document.activeElement===$("modal"))){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===$("modal"))){e.preventDefault();first.focus();}
  }
});
function lose(reason){gameOver=true;outcome="lost";showModal(`<h2>THE ISLAND WINS THIS TIME</h2><p>${reason}</p><button class="choice" id="restart">TRY AGAIN</button>`);$("restart").addEventListener("click",()=>{saveEnabled=false;try{localStorage.removeItem(SAVE_KEY);}catch{}location.reload();});}

</script>
<script src="gameplay-v021.js"></script>
<script>
initCombatContent();
$("turn").addEventListener("click",()=>showPlayer(active));
document.querySelectorAll(".action").forEach(btn=>btn.addEventListener("click",()=>handleAction(btn.dataset.action)));
$("overlay").addEventListener("click",e=>{if(e.target===$("overlay")&&modalDismissible)closeModal();});
toast("Tap MOVE, then a connected region. The map stays on screen while you play.");
new ResizeObserver(fitBoard).observe($("mapWrap"));
$("motionToggle").addEventListener("click",()=>{reduceMotion=!reduceMotion;clearTimeout(travelTimer);travelBusy=false;render();});
render();
const savedAdventure=loadSave();
if(savedAdventure)showResume(savedAdventure);else showPartySetup();
</script>
